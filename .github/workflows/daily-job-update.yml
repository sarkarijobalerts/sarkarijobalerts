name: Daily Job Alerts Update & Deploy

on:
  schedule:
    # 10:00 AM IST (UTC+5:30) = 04:30 UTC
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: 🔑 Configure Environment & Credentials
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Create backend .env from GitHub Secrets
          cat << 'EOF' > backend/.env
          PORT=5000
          NODE_ENV=production
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN=${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GROUP_ID=${{ secrets.FACEBOOK_GROUP_ID }}
          NEXT_PUBLIC_ONESIGNAL_APP_ID=${{ secrets.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
          ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY=${{ secrets.ONESIGNAL_REST_API_KEY }}
          EOF

          # Write Google Service Account JSON if provided
          if [ -n "$GOOGLE_SA_KEY" ]; then
            mkdir -p backend/config
            echo "$GOOGLE_SA_KEY" > backend/config/google-service-account.json
            echo "Google Service Account configured."
          fi

      - name: 🔄 Scrape New Jobs & Enrich Content
        run: |
          cd backend
          node scripts/manualFullUpdate.js

      - name: 🏗️ Build Static Frontend & Generate Sitemap
        run: |
          cd frontend
          npm run build

      - name: 💾 Commit & Push Updated Dataset to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/seedPosts.json frontend/lib/expiredSlugs.json frontend/public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes found to commit. Skipping commit."
          else
            git commit -m "Auto-update job posts & sitemap $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi

      - name: 🔍 Check Hostinger Deployment Credentials
        run: |
          if [ -z "$HOSTINGER_FTP_PASSWORD" ] && [ -z "$FTP_PASSWORD" ]; then
            echo "::warning title=Missing Hostinger FTP Password::HOSTINGER_FTP_PASSWORD secret is not set in GitHub repository secrets. FTPS deployment will be skipped. To enable automated Hostinger deployment from GitHub Actions, add HOSTINGER_FTP_PASSWORD to GitHub Repo Settings -> Secrets and variables -> Actions."
          else
            echo "Hostinger FTPS credentials detected. Proceeding with deployment."
          fi

      - name: 🚀 Deploy to Hostinger via FTPS
        if: env.HOSTINGER_FTP_PASSWORD != '' || env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER || secrets.FTP_SERVER || 'ftp.sarkarijobalerts.com' }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME || secrets.FTP_USERNAME || 'u340027669' }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          local-dir: ./frontend/out/
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR || 'domains/sarkarijobalerts.com/public_html/' }}
          dangerous-clean-slate: false
